name: Rupeek
description: 'Rupeek is an asset-backed online gold loan company operating across India,
  enabling customers to borrow money by pledging gold jewelry as collateral. Its products
  include gold loans (from around 30,000 up to 1.5 crore rupees), gold loan balance
  transfers, the Rupeek Gold Card, part/full gold release, and an online repayment
  portal. The company partners with banks such as Federal Bank, Indian Bank, and South
  Indian Bank, offers 100% insurance coverage via New India Assurance, and delivers
  its consumer experience primarily through its website and highly-rated mobile app.
  It is ISO 27001 certified. Rupeek is a consumer fintech surfaced as a portfolio company
  of Accel and GGV Capital; it publishes no public developer API surface, so this profile
  is an identity-only company record.'
